# ===============================
# ROUTES - MemorIA_backend (port 8080) - CATCH-ALL pour /api/**
# order=100 forces this route to evaluate AFTER any specific route
# (doit rester en dernier — /api/auth/**, /api/users/**, etc. tombent ici)
# ===============================
spring.cloud.gateway.routes[17].id=memoria-backend-all
spring.cloud.gateway.routes[17].uri=lb://MemorIA-backend
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[17].order=100

# ===============================
# CORS - Global Gateway config
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ===============================
# DEDUP CORS HEADERS (evite les doublons Gateway + Backend)
# ===============================
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ===============================
# LOGGING (activer pour debug)
# ===============================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=gateway-debug.log
