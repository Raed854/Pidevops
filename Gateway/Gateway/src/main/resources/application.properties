spring.application.name=Gateway
server.port=9090

# ===============================
# EUREKA
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================
# ROUTES - MemorIA_communaute (port 8082)
# Le frontend appelle /api/community/... -> on strip le prefix /api/community
# ===============================
spring.cloud.gateway.routes[0].id=memoria-communaute
spring.cloud.gateway.routes[0].uri=lb://MemorIA-communaute
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/community/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

# WebSocket communaute (presence)
spring.cloud.gateway.routes[1].id=memoria-communaute-ws
spring.cloud.gateway.routes[1].uri=lb://MemorIA-communaute
spring.cloud.gateway.routes[1].predicates[0]=Path=/ws/presence/**

