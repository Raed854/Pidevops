# MemorIA_BackendJesser — Doctor/Patient/Test mgmt + OAuth2. Port 8084.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoria-jesser
  namespace: pidev
  labels: { app: memoria-jesser }
spec:
  replicas: 1
  selector:
    matchLabels: { app: memoria-jesser }
  template:
    metadata:
      labels: { app: memoria-jesser }
    spec:
      containers:
        - name: memoria-jesser
          image: nefziraed/memoria-jesser:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/Memoria_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: mysql-secret, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: password } }
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "true"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "true"
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "true"
          startupProbe:
            tcpSocket: { port: 8084 }
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: 8084 }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 8084 }
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memoria-jesser
  namespace: pidev
spec:
  selector: { app: memoria-jesser }
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
  type: NodePort
