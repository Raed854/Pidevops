# MySQL credentials — base64-encoded
# To regenerate values:
#   echo -n 'rootpass'  | base64    # cm9vdHBhc3M=
#   echo -n 'root'      | base64    # cm9vdA==
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: pidev
type: Opaque
data:
  root-password: cm9vdHBhc3M=    # rootpass
  username:      cm9vdA==        # root  (matches application.properties)
  password:      cm9vdHBhc3M=    # rootpass — used by Spring services
