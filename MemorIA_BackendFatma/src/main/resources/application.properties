# ===============================
# APPLICATION
# ===============================
spring.application.name=MemorIA-backend-fatma
server.port=8085

# ===============================
# MYSQL DATABASE CONFIGURATION
# Shared with MemorIA_Backend — same "users" table across the architecture.
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/Memoria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== HIKARI CONNECTION POOL ==========
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# Initialize chat_messages table at startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:init.sql

# ===============================
# EUREKA CLIENT (microservice registration)
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# OPTIONAL (Good Practice)
# ===============================
spring.jpa.open-in-view=false

# ===============================
# JWT SECURITY CONFIGURATION
# ===============================
api.jwt.secret=your-very-long-secret-key-min-32-chars-here-change-in-production!
api.jwt.expiration=86400000

# ===============================
# CORS CONFIGURATION
# ===============================
api.frontend.url=http://localhost:4200
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:9090

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.MemorIA=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JACKSON SERIALIZATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Paris
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===============================
# EMAIL (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=Jasserchouat3@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=Jasserchouat3@gmail.com

# ===============================
# SCHEDULER NOTIFICATIONS
# ===============================
logging.level.MemorIA.scheduler=INFO
logging.level.MemorIA.service.ReminderNotificationService=INFO

# ===============================
# ADMIN BOOTSTRAP CONFIGURATION
# ===============================
app.admin.email=admin@memoria.com
app.admin.password=Admin@123

# ===============================
# SMS NOTIFICATIONS (Twilio)
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
sms.enabled=true
sms.default.language=fr-FR

# ===============================
# ACTUATOR / HEALTH CHECK
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.db.enabled=true
