spring.application.name=cognitive-module
server.port=8090

# ===============================
# PRIMARY DATASOURCE — PostgreSQL (cognitive module data)
# Custom prefix (app.datasource.*) avoids conflict with Spring Boot's
# built-in spring.datasource.* auto-configuration.
# ===============================
app.datasource.postgres.url=jdbc:postgresql://localhost:5432/alzheimer-tests
app.datasource.postgres.username=postgres
app.datasource.postgres.password=raed
app.datasource.postgres.driver-class-name=org.postgresql.Driver

# ===============================
# SECONDARY DATASOURCE — MySQL Memoria_db (shared users table)
# ===============================
app.datasource.mysql.url=jdbc:mysql://localhost:3306/Memoria_db?createDatabaseIfNotExist=true
app.datasource.mysql.username=root
app.datasource.mysql.password=
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE (shared settings)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# data.sql disabled — User data now lives in MySQL Memoria_db
# (populated by MemorIA_backend, not by this module).
spring.sql.init.mode=never

# Jackson — sérialisation/désérialisation des dates Java 8 (LocalDateTime)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.med.cognitive=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG

# User Module Integration
user.module.integration=db

# ===============================
# EUREKA CLIENT
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
